name: CI
on:
  push: {branches: [demo/ci-resume]}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q pytest
      - name: Resume window
        run: sleep 90
      - run: python -m pytest -q
